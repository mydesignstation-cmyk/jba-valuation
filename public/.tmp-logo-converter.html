<!doctype html><meta charset="utf-8"><canvas id="c" width="128" height="128"></canvas><script>fetch('/raw-base.txt').then(r=>r.text()).then(s=>{const i=new Image();i.onload=()=>{const c=document.getElementById('c'),x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,128,128);x.drawImage(i,0,0,128,128);document.title=c.toDataURL('image/png')};i.src='data:image/webp;base64,'+s.trim()})</script>
